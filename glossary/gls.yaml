RISCV:
  short: RISC-V
  long: Reduced Instruction Set Computer Version 5
  description: An open-source computer architecture designed for flexibility in computing processor designs. Unlike its competitors, RISC-V can be freely modified to suit different applications, making it popular for research, AI, and low-power devices.
  group: Computer Architecture

AI:
  short: AI
  long: Artificial Intelligence
  description: The branch of computer science dealing with the reproduction or mimicking of human-level intelligence, self-awareness, knowledge, conscience, thought in computer programs.
  group: "@AI"

CPU:
  short: CPU
  long: Central Processing Unit
  description: The central processing unit, responsible for executing instructions and managing tasks in a computer system. It handles general-purpose computations.
  group: Computer Architecture

GPU:
  short: GPU
  long: Graphical Processing Unit
  description: A specialized processor designed to accelerate graphics rendering and parallel data processing, often used in AI and deep learning tasks.
  group: Computer Architecture

ML:
  short: ML
  long: Machine Learning
  description: A subset of AI where machines learn from data to make predictions or decisions without being explicitly programmed, widely used in applications like recommendation systems and image recognition.
  group: "@AI"

IO:
  short: I/O
  long: Input/Output
  group: Computer Architecture

DL:
  short: DL
  long: Deep Learning
  group: "@AI"

ISA:
  short: ISA
  long: Instruction Set Architecture
  description: A set of rules and instructions that a computer's CPU can execute. It acts as a bridge between hardware and software, defining how a processor handles data.
  group: Computer Architecture

IoT:
  short: IoT
  long: Internet of Things
  description: A network of physical objects embedded with sensors and software that can collect and exchange data over the internet, enabling smart applications like home automation and industrial monitoring.
  group: Embedded Systems

ASIC:
  short: ASIC
  long: Application-Specific Integrated Circuit
  description: A custom-built chip designed for one specific task, offering high speed and energy efficiency for that purpose.
  group: Electronics

NN:
  short: NN
  long: Neural Network
  group: "@AI"

