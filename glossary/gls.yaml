#   description: A measure of computer performance, particularly in fields requiring large-scale mathematical computations, such as scientific simulations and AI.

IoIT:
  short: IoIT
  long: Internet of Intelligent Things
  description: An advanced form of @IoT:noindex, where devices not only collect and exchange data but also use @AI:noindex to process information and make intelligent decisions at the edge.
  group: "@AI:long:noindex"

