IC:
  short: IC
  long: Image Classification
  group: "@AI:long:noindex"

VWW:
  short: VWW
  long: Visual Wake Words
  group: "@AI:long:noindex"

ARM:
  short: ARM
  long: Advanced RISC Machine
  description: A family of reduced instruction set computing (RISC) architectures for computer processors, widely used in mobile devices and embedded systems due to its power efficiency and performance.
  group: Computer Architecture

RVV:
  short: RVV
  long: RISC-V "V" Vector
  group: Computer Architecture

FPGA:
  short: FPGA
  long: Field-Programmable Gate Array